name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Install only, never run: make lint runs golangci-lint itself, so the
      # gate here is the one a developer runs locally.
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # make fmt-check refuses to run without goimports rather than skipping it.
      - name: Install goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.52.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Gate
        run: make ci
